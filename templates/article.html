<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} — {{site_name}}</title>
<meta name="description" content="{{dek}}">
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{dek}}">
<meta property="og:url" content="{{canonical}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<header class="site-header">
<div class="site-header__inner">
<a class="brand" href="/"><span class="brand-mark" aria-hidden="true">A</span><span class="brand-name">{{site_name}}</span></a>
<nav id="site-nav" class="site-nav" aria-label="Primary"><a href="/">Home</a><a href="/about.html">About</a><a href="/writing.html" aria-current="page">Writing</a></nav>
</div>
</header>
<main>
<article class="article">
<header>
<p class="eyebrow">{{category}}</p>
<h1>{{title}}</h1>
<p class="lede">{{dek}}</p>
<p class="article-meta">{{date}} · {{reading_minutes}} min read</p>
</header>
<div class="article-body">{{body_html}}</div>
</article>
</main>
<footer class="site-footer"><div class="site-footer__inner"><span class="brand-name">{{site_name}}</span><span>Built with AI Native CMS.</span></div></footer>
</body>
</html>
