; AI Native CMS private runtime configuration
; Copy to a private path outside the public site root, such as ~/.ai-native-cms.ini.
; Replace every placeholder with a real value. Never commit the populated file.

AINCMS_ENV=production
AINCMS_PUBLIC_ORIGIN=https://example.com

AINCMS_DB_HOST=localhost
AINCMS_DB_PORT=3306
AINCMS_DB_NAME=replace_me
AINCMS_DB_USER=replace_me
AINCMS_DB_PASSWORD=replace_me
; AINCMS_DB_SOCKET=
; AINCMS_DB_SSL_CA=/absolute/private/path/provider-ca.pem
; AINCMS_DB_REQUIRE_TLS=1
; AINCMS_DB_ALLOW_INSECURE_REMOTE=0

AINCMS_CMS_ENABLED=1
AINCMS_CMS_USER=replace_me
AINCMS_CMS_PASSWORD_HASH=replace_with_password_hash_output
AINCMS_CMS_REQUIRE_HTTPS=1
AINCMS_CMS_IDLE_TIMEOUT=7200
AINCMS_CMS_ABSOLUTE_TIMEOUT=43200
AINCMS_CMS_BIND_USER_AGENT=1

AINCMS_RATE_LIMIT_SECRET=replace_with_random_secret
AINCMS_TRUST_PROXY_HEADERS=0
AINCMS_DEBUG_ERRORS=0
AINCMS_ALLOW_ORIGINLESS_REQUESTS=0

; M-019 transactional Audience mail. Keep these values private.
; For cPanel: Email Accounts → Connect Devices → Secure SSL/TLS Settings (Recommended).
; Copy the exact outgoing host/port shown by the provider; do not assume mail.<domain>.
; AINCMS_MAIL_TRANSPORT=smtp
; AINCMS_MAIL_HOST=mail.example.com
; AINCMS_MAIL_PORT=465
; AINCMS_MAIL_SECURITY=ssl
; AINCMS_MAIL_USERNAME=updates@example.com
; AINCMS_MAIL_PASSWORD=replace_with_mailbox_password
; AINCMS_MAIL_FROM=updates@example.com
; AINCMS_MAIL_FROM_NAME=Example Site
; Development/CI only: AINCMS_MAIL_TRANSPORT=log
; Explicit non-production escape hatch only: AINCMS_ALLOW_MAIL_LOG=0
