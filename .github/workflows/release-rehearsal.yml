name: release-rehearsal

on:
  pull_request:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-candidate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: aincms
          MYSQL_USER: aincms
          MYSQL_PASSWORD: rehearsal-db-pass
          MYSQL_ROOT_PASSWORD: rehearsal-root-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prehearsal-root-pass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AINCMS_DB_HOST: 127.0.0.1
      AINCMS_DB_PORT: 3306
      AINCMS_DB_NAME: aincms
      AINCMS_DB_USER: aincms
      AINCMS_DB_PASSWORD: rehearsal-db-pass
      AINCMS_REHEARSAL_ROOT_PASSWORD: rehearsal-root-pass
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install rehearsal runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y php-mysql mysql-client
          php -m | grep -qi pdo_mysql
      - name: Clean rc.4 schema-v10 candidate rehearsal
        run: bash tests/release_rehearsal.sh "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Published rc.3 schema-v8 to v9 composition rehearsal
        run: bash tests/schema_v9_rehearsal.sh
      - name: Schema v9 to v10 Audience and mail rehearsal
        run: bash tests/schema_v10_rehearsal.sh
      - name: Upload rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-native-cms-rc4-release-rehearsal-evidence
          path: |
            /tmp/aincms-build-a.json
            /tmp/aincms-build-b.json
            /tmp/aincms-bootstrap.txt
            /tmp/aincms-reconcile.json
            /tmp/aincms-readiness-before.json
            /tmp/aincms-login.json
            /tmp/aincms-onboarding.json
            /tmp/aincms-readiness-after.json
            /tmp/aincms-canonical-path.txt
            /tmp/aincms-discovery-summary.json
            /tmp/aincms-server.log
            /tmp/aincms-v9-site-setup.txt
            /tmp/aincms-v9-migration.json
            /tmp/aincms-v9-migration-second.json
            /tmp/aincms-v9-composition.json
            /tmp/aincms-v10-migration.json
            /tmp/aincms-v10-migration-second.json
            /tmp/aincms-v10-audience.json
            /tmp/aincms-smtp-message.txt
          if-no-files-found: ignore
          retention-days: 7
