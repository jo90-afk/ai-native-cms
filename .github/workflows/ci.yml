name: validate

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'plan/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Public-release contract
        run: python3 tests/public_release_contract.py
      - name: Content-authority contract
        run: python3 tests/content_authority_contract.py
      - name: Rebuild and CMS UI contract
        run: python3 tests/rebuild_ui_contract.py
      - name: Publishing and SEO contract
        run: python3 tests/publishing_seo_contract.py
      - name: Composer and media contract
        run: python3 tests/composer_media_contract.py
      - name: Hierarchy navigation and branding contract
        run: python3 tests/site_wide_contract.py
      - name: Bootstrap and readiness contract
        run: python3 tests/bootstrap_readiness_contract.py
      - name: Schema v8 redirects contract
        run: python3 tests/schema_v8_redirects_contract.py
      - name: Deployment adapter contract
        run: python3 tests/deployment_adapters_contract.py
      - name: Release candidate contract
        run: python3 tests/release_candidate_contract.py
      - name: Content primitive behavior
        run: php tests/content_core.php
      - name: Publishing and SEO behavior
        run: php tests/publishing_core.php
      - name: Composer and media behavior
        run: php tests/composer_media_core.php
      - name: Site-wide presentation behavior
        run: php tests/site_wide_core.php
      - name: Bootstrap and readiness behavior
        run: php tests/bootstrap_readiness_core.php
      - name: Redirect and migration behavior
        run: php tests/redirect_core.php
      - name: PHP syntax
        run: |
          find api cms config database tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l __redirect.php
          php -l __redirect-map.php
      - name: JavaScript syntax
        run: |
          find cms -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Python syntax
        run: python3 -m py_compile tests/public_release_contract.py tests/content_authority_contract.py tests/rebuild_ui_contract.py tests/publishing_seo_contract.py tests/composer_media_contract.py tests/site_wide_contract.py tests/bootstrap_readiness_contract.py tests/schema_v8_redirects_contract.py tests/deployment_adapters_contract.py tests/release_candidate_contract.py tools/build_release.py
      - name: Build internal release candidate
        run: python3 tools/build_release.py --source-ref "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Upload internal release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ai-native-cms-internal-rc
          path: dist/*
          retention-days: 7
